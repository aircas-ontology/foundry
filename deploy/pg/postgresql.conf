# postgresql.conf
# 允许外部连接（容器内一般默认开启）
listen_addresses = '*'

# 开启逻辑复制（必须重启 PostgreSQL 生效）
wal_level = logical

# 逻辑复制槽数量
max_replication_slots = 10

# 用于复制的 WAL 发送进程数
max_wal_senders = 10

# 可选：增大连接数（如果 max_wal_senders 调高后需要配合调整）
# max_connections = 200

# 可选：WAL 大小设置，保持默认也可
# max_wal_size = 1GB
# min_wal_size = 80MB