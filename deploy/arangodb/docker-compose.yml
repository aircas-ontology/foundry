version: '3.8'

services:
  arangodb:
    restart: always
    image: arangodb:latest
    container_name: arangodb
    environment:
      ARANGO_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "8529:8529"
    volumes:
      - ./arangodb3:/var/lib/arangodb3
      - ./logs:/var/log/arangodb3
      - ./apps:/var/lib/arangodb3-apps
