version: '3.8'

# 脚本函数多语言 Runner 编排：四语言各一独立容器，language -> runner 严格一对一
# 部署方式：现成基础镜像 + 挂 jar / 源码，主机无需装 JDK / Python / Node，仅需 Docker
# 端口约定：python=39101、ts=39102、groovy=39103、java=39104
# 与 ontology-server 同级部署（同 network_mode: host，主应用通过 127.0.0.1:<port> 调用）

services:
  groovy-runner:
    image: eclipse-temurin:17-jdk           # jdk 非 jre，Java 脚本动态编译依赖 javac
    container_name: groovy-runner
    restart: always
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./jvm-runner/jvm-runner.jar:/app/jvm-runner.jar:ro
    environment:
      - TZ=Asia/Shanghai
    command: ["java","-jar","/app/jvm-runner.jar",
              "--runner.language=groovy",
              "--server.port=39103"]
    mem_limit: 1g
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/39103' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  java-runner:
    image: eclipse-temurin:17-jdk
    container_name: java-runner
    restart: always
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./jvm-runner/jvm-runner.jar:/app/jvm-runner.jar:ro
    environment:
      - TZ=Asia/Shanghai
    command: ["java","-jar","/app/jvm-runner.jar",
              "--runner.language=java",
              "--server.port=39104"]
    mem_limit: 1g
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/39104' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  python-runner:
    image: python:3.12-slim
    container_name: python-runner
    restart: always
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./python-runner:/app:ro
      - python-site-packages:/root/.local/lib/python3.12/site-packages
    environment:
      - TZ=Asia/Shanghai
      - RUNNER_TIMEOUT_MS=5000
    command: sh -c "pip install --user -r requirements.txt &&
                    exec python -m uvicorn app:app --host 0.0.0.0 --port 39101 --workers 1"
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:39101/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ts-runner:
    image: node:20-slim
    container_name: ts-runner
    restart: always
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./ts-runner:/app
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=39102
      - RUNNER_TIMEOUT_MS=5000
    command: sh -c "npm install --omit=dev && exec node server.js"
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:39102/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  python-site-packages:
