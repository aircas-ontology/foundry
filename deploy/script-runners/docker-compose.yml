version: '3.8'

# 脚本函数多语言 Runner 编排：四语言各一独立容器，language -> runner 严格一对一。
# 与 ontology-backend 同级部署（同 network_mode: host，主应用通过 127.0.0.1:<port> 调用）。
# 端口约定：python=39101、ts=39102、groovy=39103、java=39104。
# jvm-runner 一份镜像按 RUNNER_LANGUAGE 部署为 groovy-runner / java-runner 两个容器。

services:
  groovy-runner:
    build:
      context: ../../script-runners/jvm-runner
      dockerfile: Dockerfile
    image: foundry/jvm-runner:1.0.0
    container_name: groovy-runner
    restart: always
    network_mode: "host"
    environment:
      RUNNER_LANGUAGE: groovy
      SERVER_PORT: "39103"
    mem_limit: 1g
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${SERVER_PORT}' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  java-runner:
    image: foundry/jvm-runner:1.0.0   # 复用 groovy-runner 构建出的同一镜像
    container_name: java-runner
    restart: always
    network_mode: "host"
    environment:
      RUNNER_LANGUAGE: java
      SERVER_PORT: "39104"
    mem_limit: 1g
    cpus: "1"
    depends_on:
      - groovy-runner                # 保证镜像已构建
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${SERVER_PORT}' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  python-runner:
    build:
      context: ../../script-runners/python-runner
      dockerfile: Dockerfile
    image: foundry/python-runner:1.0.0
    container_name: python-runner
    restart: always
    network_mode: "host"
    environment:
      RUNNER_TIMEOUT_MS: "5000"
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:39101/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ts-runner:
    build:
      context: ../../script-runners/ts-runner
      dockerfile: Dockerfile
    image: foundry/ts-runner:1.0.0
    container_name: ts-runner
    restart: always
    network_mode: "host"
    environment:
      SERVER_PORT: "39102"
      RUNNER_TIMEOUT_MS: "5000"
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:39102/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
