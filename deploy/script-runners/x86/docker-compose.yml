version: '3.8'

# x86_64 内网离线部署 —— 4 Runner 容器
# 前提：deploy.sh 已加载 images/ 下的 tar（或手动 docker load）
# 本文件不会 pull 远程镜像

services:
  groovy-runner:
    image: foundry/jvm-runner:offline
    pull_policy: never
    container_name: groovy-runner
    restart: always
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - RUNNER_LANGUAGE=groovy
      - SERVER_PORT=39103
    mem_limit: 1g
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/39103' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  java-runner:
    image: foundry/jvm-runner:offline
    pull_policy: never
    container_name: java-runner
    restart: always
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - RUNNER_LANGUAGE=java
      - SERVER_PORT=39104
    mem_limit: 1g
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/39104' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  python-runner:
    image: foundry/python-runner:offline
    pull_policy: never
    container_name: python-runner
    restart: always
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=39101
      - RUNNER_TIMEOUT_MS=5000
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys,os; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('SERVER_PORT','39101')+'/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ts-runner:
    image: foundry/ts-runner:offline
    pull_policy: never
    container_name: ts-runner
    restart: always
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=39102
      - RUNNER_TIMEOUT_MS=5000
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:'+process.env.SERVER_PORT+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
