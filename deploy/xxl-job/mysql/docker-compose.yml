version: '3.8'

services:
  mysql:
    image: mysql:8.0.32
    container_name: ontology-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=job
      - MYSQL_USER=iecas
      - MYSQL_PASSWORD=123456
    ports:
      - "33306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always


