version: '3.8'

services:
  app:
    restart: always
    image: eclipse-temurin:17-jdk        # 必须 JDK 非 JRE：Java 脚本函数在主程序内动态编译依赖 javac
    container_name: ontology-backend
    # 封顶容器 stdout 日志：jar 内 logback 已把全量 INFO 落文件、stdout 只留 WARN+；
    # 旧代码未 redeploy 前 stdout 仍刷 INFO，加此段兜底，防止 json.log 无限增长撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    network_mode: "host"
    #ports:
    #   - "38002:38002"
    volumes:
      - ./ontology-encrypted.jar:/app/app.jar  # 挂载Spring Boot应用的JAR包
      - ./application_ptr.yml:/app/application.yml  # 挂载应用配置文件
      - ./logs:/app/logs  # 挂载日志文件目录
      - ./orekit-data:/app/orekit-data
      - ./license.lic:/app/license.lic
      - ./container-images:/app/container-images  # 容器算子镜像 tar：落到宿主机 jar 同级，持久且可见
      - ./interface-docs:/app/interface-docs  # 容器算子接口文档：同上
    command: java -javaagent:/app/app.jar='-pwd iecas`12'  -Dspring.config.location=file:/app/application.yml -jar /app/app.jar


