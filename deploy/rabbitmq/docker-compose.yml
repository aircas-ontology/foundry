
version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:4.3.1-management
    container_name: ontology-rabbitmq
    hostname: rabbitmq
    restart: always
    privileged: false
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:

