version: "3.8"

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.25
    container_name: ontology-kibana
    restart: always
    ports:
      - "10704:5601"
    environment:
      - I18N_LOCALE=zh-CN
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://ontology-elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kafka_default

networks:
  kafka_default:
    external: true
