server:
  port: 36005

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: ontology
          uri: lb://ontology
          predicates:
            - Path=/api/ontology/**
          filters:
            - StripPrefix=1

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 30
    secure-port-enabled: false
    non-secure-port-enabled: true
  client:
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:36000/eureka/