server:
  port: 37003
  servlet:
    context-path: /agent

spring:
  application:
    name: agent
  jackson:
    default-property-inclusion: non_null
  ai:
    # 阿里云百炼（Model Studio）——底层服务名仍为 DashScope，starter 配置前缀固定为 spring.ai.dashscope
    dashscope:
      # 密钥不写入仓库，通过环境变量 BAILIAN_API_KEY 或 DASHSCOPE_API_KEY 注入；
      # 默认占位值仅用于保证应用能正常启动（未注入真实密钥时不可调用大模型）
      api-key: ${BAILIAN_API_KEY:${DASHSCOPE_API_KEY:please-set-your-dashscope-api-key}}
      chat:
        options:
          model: qwen-flash
          temperature: 0.7

# Agent 自定义配置
agent:
  ontology:
    # ontology-server 基础地址（含其 context-path /ontology）；工具适配器据此拼接 /tool/** 调用原子操作
    base-url: ${ONTOLOGY_BASE_URL:http://127.0.0.1:37002/ontology}
    connect-timeout: 5000
    read-timeout: 30000

# Knife4j / SpringDoc OpenAPI 3 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
