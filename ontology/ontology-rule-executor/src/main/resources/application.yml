okhttp:
  connect-timeout-ms: 1000
  keep-alive-duration-sec: 5000
  max-idle: 100
  read-timeout-ms: 5000
  write-timeout-ms: 5000
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
ribbon:
  readTimeout: 120000
  connectTimeout: 120000


