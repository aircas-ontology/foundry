server:
  port: 37010
  servlet:
    context-path: /rule_executor

spring:
  application:
    name: ontology-rule-executor
  datasource:
    driver-class-name: org.postgresql.Driver
      #url: jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}?currentSchema=ontology
    url: jdbc:postgresql://192.168.9.11:35432/postgres?currentSchema=ontology
    username: iecas
    password: iecas123
    validation-query: SELECT 1
    test-on-borrow: true
http:
  # 最大连接数
  maxTotal: 30
  # 并发数
  defaultMaxPerRoute: 20
  # 创建连接的最长时间
  connectTimeout: 30000
  # 从连接池中获取到连接的最长时间
  connectionRequestTimeout: 10000
  # 数据传输的最长时间
  socketTimeout: 120000
  # 提交请求前测试连接是否可用
  staleConnectionCheckEnabled: true
#ribbon:
