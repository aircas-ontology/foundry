license:
  enable: false
  licensePath: 'D:\ideaProjects\license.lic'
  publicKeyStorePath: "/publicCerts.keystore"
  storePass: iecas123
  alias: publiccert
  subject: aircas


rag:
  knowledge-url: http://192.168.9.13:1124/chat/ask
  build-url: http://192.168.9.13:1124/ontology/build

threadpool:
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 100
  keep-alive-seconds: 60
  thread-name-prefix: ontology-thread-

# 脚本函数多语言执行：Python/TypeScript 走独立 Runner 容器；Groovy/Java 在主程序进程内执行。
script-runner:
  python: http://172.16.18.58:39101
  typescript: http://172.16.18.58:39102
  timeout-ms: 5000

# 容器算子：镜像 / 接口文档上传存储目录与大小限制。
# image-dir / doc-dir 留空时默认落在 jar 包同级目录下的 container-images/ 与 interface-docs/。
# arm-check-enabled 是否校验镜像为 ARM64 架构；无 ARM 环境本地测试可置 false 跳过校验。
# exec-host 执行期访问容器映射端口的基地址（同宿主机默认 127.0.0.1，服务在容器内需改宿主机 IP）。
container-operator:
  image-dir:
  doc-dir:
  max-image-size-mb: 2048
  arm-check-enabled: false
  exec-host: 127.0.0.1
  exec-timeout-seconds: 30
  node:
    ip: 172.16.18.62
    port: 37002

# 算子限流（跨实例）
rate-limit:
  enabled: true
  key-prefix: "foundry:rl:"
  concurrency-ttl: 3600