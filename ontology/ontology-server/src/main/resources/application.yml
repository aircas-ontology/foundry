server:
  port: 37002
  servlet:
    context-path: /ontology

spring:
  jackson:
    default-property-inclusion: non_null
  application:
    name: ontology
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1024MB
  datasource:
    main:
      driver-class-name: org.postgresql.Driver
      #url: jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}?currentSchema=ontology
      url: jdbc:postgresql://127.0.0.1:35432/postgres?currentSchema=ontology&rewriteBatchedStatements=true&TimeZone=UTC
      username: iecas
      password: iecas123
      validation-query: SELECT 1
      test-on-borrow: true
    datalake:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://127.0.0.1:35432/entity_datasource
      username: iecas
      password: iecas123
    arangodb:
      host: 127.0.0.1
      port: 8529
      database: entity
      collections: node,relation
      user: root
      password: root
      connections:
        max: 8
        ttl: 1800
      timeout:
        connect: 5000
        request: 10000
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    virtual-host: /
  kafka:
    bootstrap-servers: 127.0.0.1:39092,127.0.0.1:39102,127.0.0.1:39094
    consumer:
      group-id: cdc-monitor-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

cdc:
  ontology-meta: ontology_server.ontology.ontology_meta
  ontology-space: ontology_server.ontology.ontology_space
  entity-datasource-prefix: entity_datasource_server

rabbitmq:
  exchange: entity.schema.exchange
  queue: entity.schema.queue
  routing-key: entity.schema



ontology:
  swagger:
    enable: true


jwt:
  secret: ontology-jwt-secret-key-2026
  access-token-expire-days: 7
  refresh-token-expire-days: 30


minio:
  endpoint: http://127.0.0.1:16337
  accessKey: root
  secretKey: iecas123
  bucketName: ptr


orekit:
  data:
    path: "ontology/ontology-server/src/main/resources/orekit-data"

