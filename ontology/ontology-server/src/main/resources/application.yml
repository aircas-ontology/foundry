server:
  port: 37002
  servlet:
    context-path: /ontology

spring:
  jackson:
    default-property-inclusion: non_null
  application:
    name: ontology
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1024MB
  datasource:
    main:
      driver-class-name: org.postgresql.Driver
      #url: jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}?currentSchema=ontology
      url: jdbc:postgresql://172.16.18.62:35432/postgres?currentSchema=ontology&rewriteBatchedStatements=true&TimeZone=UTC
      username: postgres
      password: 123456
      validation-query: SELECT 1
      test-on-borrow: true
    datalake:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://172.16.18.62:35432/entity_datasource
      username: postgres
      password: 123456
    arangodb:
      host: 172.16.18.62
      port: 8529
      database: entity
      collections: node,relation
      user: root
      password: root
      connections:
        max: 8
        ttl: 1800
      timeout:
        connect: 5000
        request: 10000
  rabbitmq:
    host: 172.16.18.62
    port: 5672
    username: admin
    password: C7O5O4AC2NAFQp9dTvwL
    virtual-host: /
  kafka:
    bootstrap-servers: 172.16.18.62:39092
    consumer:
      group-id: cdc-monitor-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  elasticsearch:
    uris: http://172.16.18.62:9200
    connection-timeout: 5s
    socket-timeout: 30s

  data:
    elasticsearch:
      repositories:
        enabled: true

cdc:
  connect:
      rest:
        url: http://172:16:18:62:8083
  ontology-topic-prefix: ontology_server
  ontology-meta: ontology.ontology_meta
  ontology-space: ontology.ontology_space
  ontology-property: ontology.ontology_property
  ontology-link-group: ontology.ontology_link_group
  entity-datasource-prefix: entity_datasource_server

rabbitmq:
  exchange: entity.schema.exchange
  queue: entity.schema.queue
  routing-key: entity.schema



ontology:
  swagger:
    enable: true

# Knife4j / SpringDoc OpenAPI 3 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html


jwt:
  # HS256 要求密钥 ≥ 256 bits（32 字节），当前 64 字节兼容 HS256/HS384/HS512，预防未来切换算法报错
  # 生产环境建议通过环境变量 JWT_SECRET 注入随机密钥，避免写死在仓库
  secret: ${JWT_SECRET:ontology-jwt-secret-key-2026-foundry-aircas-ptr-hs256-random-v1a}
  access-token-expire-days: 7
  refresh-token-expire-days: 30


minio:
  endpoint: http://172.16.18.58:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ptr


orekit:
  data:
    path: "ontology/ontology-server/src/main/resources/orekit-data"

