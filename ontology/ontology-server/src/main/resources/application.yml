# 配置约定：
# 1. 新增配置项时，必须在本文件（application.yml）中声明 key，保持结构完整、可被仓库共享。
# 2. 环境相关 / 敏感 value 写在 application-local.yml，由本地维护，不要提交到 Git。
# 3. 启动时使用 spring.profiles.active=local 加载本地覆盖；application-local.yml 已加入 .gitignore。
# 4. 注意：Spring Boot 强类型属性（如 DataSize）不要留空字符串，需在 local 中给出合法值，或直接删除该 key 使用默认值。
server:
  port: 37002
  servlet:
    context-path: /ontology


spring:
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  application:
    name: ontology
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1024MB
  datasource:
    main:
      driver-class-name: org.postgresql.Driver
      url:
      username:
      password:
      validation-query: SELECT 1
      test-on-borrow: true
    datalake:
      driver-class-name: org.postgresql.Driver
      url:
      username:
      password:
    arangodb:
      host:
      port:
      database:
      collections:
      user:
      password:
      connections:
        max: 8
        ttl: 1800
      timeout:
        connect: 5000
        request: 10000
  rabbitmq:
    host:
    port:
    username:
    password:
    virtual-host:
  kafka:
    bootstrap-servers:
    consumer:
      group-id: cdc-monitor-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  elasticsearch:
    uris: http://172.16.18.62:9200
    connection-timeout: 5s
    socket-timeout: 30s

  data:
    elasticsearch:
      repositories:
        enabled: true

cdc:
  connect:
    rest:
      url: http://172.16.18.62:8083
  datasource:
    hostname: 172.16.18.58
    port: 35432
  ontology-topic-prefix: ontology_server
  ontology-meta: ontology.ontology_meta
  ontology-space: ontology.ontology_space
  ontology-property: ontology.ontology_property
  ontology-link-group: ontology.ontology_link_group
  entity-datasource-prefix: entity_datasource_server

rabbitmq:
  exchange: entity.schema.exchange
  queue: entity.schema.queue
  routing-key: entity.schema



ontology:
  swagger:
    enable: true
  space-binding:
    users:
      admin2: 89
      admin3: 88
  # 函数编排（LiteFlow 组合函数）运行期配置
  composite:
    # JS 转换脚本通过 node 子进程执行（JDK17 无 Nashorn/GraalJS），可用值：node 的绝对路径或命令名
    node-executable: node
    # 单个转换脚本的执行超时（秒）
    script-timeout-seconds: 10

# LiteFlow 规则引擎：编排执行链全部由后端在运行期动态注册（CompositeChainRegistry），
# 因此不配置 rule-source；LiteFlow 在 rule-source 为空时不会加载任何静态规则文件。
liteflow:
  enable: true
  print-banner: false
  print-execution-log: false
  # JDK17 下虚拟线程与 LiteFlow 线程池隔离组合不稳定，统一关闭
  enable-virtual-thread: false
  monitor:
    enable-log: false

# Knife4j / SpringDoc OpenAPI 3 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html


jwt:
  # HS256 要求密钥 ≥ 256 bits（32 字节），当前 64 字节兼容 HS256/HS384/HS512，预防未来切换算法报错
  # 生产环境建议通过环境变量 JWT_SECRET 注入随机密钥，避免写死在仓库
  secret:
  access-token-expire-days: 7
  refresh-token-expire-days: 30


minio:
  endpoint:
  accessKey:
  secretKey:
  bucketName:


orekit:
  data:
    path: "ontology/ontology-server/src/main/resources/orekit-data"




xxl:
  job:
    baseUrl:
    admin:
      addresses: ${xxl.job.baseUrl}
      addJobUrl:  ${xxl.job.baseUrl}/jobinfo/add
      queryJobExecutorUrl: ${xxl.job.baseUrl}/jobgroup/pageList
      queryJobInfoUrl: ${xxl.job.baseUrl}/jobinfo/pageList
      updateJobUrl: ${xxl.job.baseUrl}/jobinfo/update
      removeJobUrl: ${xxl.job.baseUrl}/jobinfo/remove
      startJobUrl: ${xxl.job.baseUrl}/jobinfo/start
      stopJobUrl: ${xxl.job.baseUrl}/jobinfo/stop
    accessToken:
    cookie:
    executor:
      appname: ontology-xxl-job-executor
      address:
      ip:
      port:
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30


license:
  enable:
  licensePath:
  publicKeyStorePath:
  storePass:
  alias:
  subject:


rag:
  knowledge-url:
  build-url:

threadpool:
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 100
  keep-alive-seconds: 60
  thread-name-prefix: ontology-thread-

# 脚本函数多语言执行：Python/TypeScript 走独立 Runner 容器；Groovy/Java 在主程序进程内执行。
# 地址 value 属环境相关，写在 application-local.yml 覆盖。
script-runner:
  python:
  typescript:
  timeout-ms: 5000