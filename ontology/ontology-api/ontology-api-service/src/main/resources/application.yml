server:
  port: 36010
  servlet:
    context-path: /rule-executor

spring:
  application:
    name: ontology-rule-executor
  datasource:
    driver-class-name: org.postgresql.Driver
      #url: jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}?currentSchema=ontology
    url: jdbc:postgresql://192.168.9.17:35432/postgres?currentSchema=ontology
    username: iecas
    password: iecas123
    validation-query: SELECT 1
    test-on-borrow: true
  redis:
    host: 192.168.9.17
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 8 # 连接池最大连接数(使用负值表示没有限制) 默认为8
        max-wait: -1ms # 连接池最大阻塞等待时间(使用负值表示没有限制) 默认为-1
        max-idle: 0 # 连接池中的最大空闲连接 默认为8
        min-idle: 0 # 连接池中的最小空闲连接 默认为 0

