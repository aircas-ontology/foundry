server:
  # groovy-runner 默认端口；java-runner 通过环境变量 SERVER_PORT=39104 覆盖
  port: 39103

spring:
  application:
    name: jvm-runner
  main:
    banner-mode: off

runner:
  # 本容器服务的语言：groovy / java（部署 java-runner 时用 RUNNER_LANGUAGE=java 覆盖）
  language: groovy
  timeout-ms: 5000

logging:
  level:
    root: INFO
